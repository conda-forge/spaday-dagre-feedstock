context:
  version: "0.2.3"
  python_min: "3.11"

package:
  name: spaday-dagre
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-dagre/spaday_dagre-${{ version }}.tar.gz
  sha256: 7436a2bf3158e647fe9e3822cb78d9e510d019c5a28d4205fc9d91cdd01da1e7

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.7,<1.0

tests:
  - python:
      imports:
        - spaday_dagre
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: dagre graph rendering for spaday
  homepage: https://github.com/1kbgz/spaday-dagre
  repository: https://github.com/1kbgz/spaday-dagre

extra:
  recipe-maintainers:
    - timkpaine
